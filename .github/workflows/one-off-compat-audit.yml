name: One-off compatibility audit patch

on:
  push:
    branches: [audit-hardening-10of10]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply compatibility audit patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit-hardening-10of10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply compatibility patch
        run: python scripts/compat_audit_patch.py
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/finance.js scripts/source-audit.mjs scripts/final-audit-test.mjs CHANGELOG.md
          git diff --cached --check
          git commit -m "Apply compatibility audit patch"
          git push origin HEAD:audit-hardening-10of10
