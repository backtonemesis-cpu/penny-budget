name: Finalize owner-income v10
on:
  push:
    branches:
      - owner-specific-accounts-income-carryforward
    paths:
      - scripts/finalize-owner-income-v10.py
      - .github/workflows/finalize-owner-income-v10.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final consistency patch
        run: python scripts/finalize-owner-income-v10.py
      - name: Validate exact final tree
        run: |
          npm ci
          npm run check
      - name: Commit final validated source
        run: |
          rm scripts/finalize-owner-income-v10.py
          rm .github/workflows/finalize-owner-income-v10.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep owner-specific accounts consistent across income"
          git push
