name: Patch historical month UI

on:
  push:
    branches:
      - completed-historical-months
    paths:
      - '.github/workflows/patch-historical-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: completed-historical-months
      - name: Apply historical reconciliation UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()

          old_grid = '''      <div className="grid">
                  <Stat label="Current Savings" value={formatMoney(summary.currentSavings)} tone="accent" sub={summary.hasSavingsSnapshot ? `${MONTHS[month]} savings snapshot` : 'No savings snapshot for this month'} />
                  <Stat label="Income This Month" value={formatMoney(summary.income)} tone="green" sub="Received or expected" onClick={onAddIncome} />
                  <Stat label="Expenses This Month" value={formatMoney(summary.expenses)} tone="amber" sub="Paid and unpaid costs" onClick={onAddExpense} />
                  <Stat label="Saved This Month" value={formatMoney(summary.savedThisMonth)} tone={summary.savedThisMonth >= 0 ? 'green' : 'red'} sub="Income − all expenses" />
                  <Stat label="Remaining Bills" value={formatMoney(summary.remainingBills)} tone={summary.remainingBills ? 'amber' : 'green'} sub="Still unpaid / to fund" />
                  <Stat label="Projected End" value={formatMoney(summary.projectedEndSavings)} tone={summary.projectedEndSavings >= 0 ? 'green' : 'red'} sub="Savings + income − unpaid bills" />
                </div>'''
          new_grid = '''      <div className="grid">
                  <Stat label={summary.isComplete ? 'Closing Savings' : 'Current Savings'} value={formatMoney(summary.currentSavings)} tone="accent" sub={summary.isComplete ? 'Recorded month-end savings' : summary.hasSavingsSnapshot ? `${MONTHS[month]} savings snapshot` : 'No savings snapshot for this month'} />
                  <Stat label="Income This Month" value={formatMoney(summary.income)} tone="green" sub={summary.isComplete ? 'Recorded income' : 'Received or expected'} onClick={onAddIncome} />
                  <Stat label="Expenses This Month" value={formatMoney(summary.expenses)} tone="amber" sub={summary.isComplete ? 'Recorded actual expenses' : 'Paid and unpaid costs'} onClick={onAddExpense} />
                  <Stat label="Saved This Month" value={formatMoney(summary.savedThisMonth)} tone={summary.savedThisMonth >= 0 ? 'green' : 'red'} sub="Income − all expenses" />
                  <Stat label={summary.isComplete ? 'Unpaid at Close' : 'Remaining Bills'} value={formatMoney(summary.remainingBills)} tone={summary.remainingBills ? 'amber' : 'green'} sub={summary.isComplete ? 'Should be zero for a completed month' : 'Still unpaid / to fund'} />
                  <Stat label={summary.isComplete ? 'Closing Position' : 'Projected End'} value={formatMoney(summary.projectedEndSavings)} tone={summary.projectedEndSavings >= 0 ? 'green' : 'red'} sub={summary.isComplete ? 'Recorded closing savings less any unpaid items' : 'Savings + income − unpaid bills'} />
                </div>'''

          old_transfer = '''      <section className="card" aria-labelledby="transfer-plan-title">
                  <div className="section-heading">
                    <div>
                      <h2 className="section-title" id="transfer-plan-title">Transfer Plan</h2>
                      <p className="section-note">Only unpaid expenses are included. Paid bills are not deducted again.</p>
                    </div>
                    <div className="money strong">{formatMoney(summary.remainingBills)}</div>
                  </div>
                  {summary.transferPlan.length ? summary.transferPlan.map((row) => (
                    <div className="row" key={row.key}>
                      <div className="grow">
                        <div className="row-title">{peopleMap[row.paidBy]?.label || row.paidBy}</div>
                        <div className="muted">{accountMap[row.account]?.label || row.account} · {row.count} item{row.count === 1 ? '' : 's'}</div>
                      </div>
                      <div className="money">{formatMoney(row.amount)}</div>
                    </div>
                  )) : <div className="empty">No transfer is currently required. All recorded expenses are marked paid.</div>}
                </section>
          
                <section className="card" aria-labelledby="transfer-check-title">
                  <h2 className="section-title" id="transfer-check-title">Transfer Check</h2>
                  <SummaryRow label="Current Savings Now" value={summary.currentSavings} />
                  <SummaryRow label="Less: Unpaid Bills Still to Cover" value={-summary.remainingBills} />
                  <SummaryRow label="Free Savings After Bills" value={summary.freeSavingsAfterBills} emphasis />
                  <SummaryRow label="Plus: Income This Month" value={summary.income} />
                  <SummaryRow label="Projected Increase This Month" value={summary.projectedIncrease} />
                  <SummaryRow label="Projected End Savings" value={summary.projectedEndSavings} emphasis />
                </section>'''
          new_transfer = '''      {summary.isComplete ? (
                  <section className="card" aria-labelledby="historical-reconciliation-title">
                    <div className="section-heading">
                      <div>
                        <h2 className="section-title" id="historical-reconciliation-title">Historical Reconciliation</h2>
                        <p className="section-note">Completed months reconcile starting savings, recorded income and actual expenses to the recorded closing savings. Income is not added again to the closing balance.</p>
                      </div>
                    </div>
                    <SummaryRow label="Starting Savings" value={summary.startingSavings} />
                    <SummaryRow label="Plus: Income This Month" value={summary.income} />
                    <SummaryRow label="Less: Expenses This Month" value={-summary.expenses} />
                    <SummaryRow label="Expected Closing Savings" value={summary.expectedClosingSavings} emphasis />
                    <SummaryRow label="Recorded Closing Savings" value={summary.currentSavings} />
                    <SummaryRow label="Reconciliation Variance" value={summary.closingVariance} emphasis />
                    {summary.remainingBills > 0 && (
                      <div className="audit-warning" role="note">
                        <strong>Completed month has unpaid items.</strong>
                        <span>Review the payment status before treating this historical month as final.</span>
                      </div>
                    )}
                  </section>
                ) : (
                  <>
                    <section className="card" aria-labelledby="transfer-plan-title">
                      <div className="section-heading">
                        <div>
                          <h2 className="section-title" id="transfer-plan-title">Transfer Plan</h2>
                          <p className="section-note">Only unpaid expenses are included. Paid bills are not deducted again.</p>
                        </div>
                        <div className="money strong">{formatMoney(summary.remainingBills)}</div>
                      </div>
                      {summary.transferPlan.length ? summary.transferPlan.map((row) => (
                        <div className="row" key={row.key}>
                          <div className="grow">
                            <div className="row-title">{peopleMap[row.paidBy]?.label || row.paidBy}</div>
                            <div className="muted">{accountMap[row.account]?.label || row.account} · {row.count} item{row.count === 1 ? '' : 's'}</div>
                          </div>
                          <div className="money">{formatMoney(row.amount)}</div>
                        </div>
                      )) : <div className="empty">No transfer is currently required. All recorded expenses are marked paid.</div>}
                    </section>
          
                    <section className="card" aria-labelledby="transfer-check-title">
                      <h2 className="section-title" id="transfer-check-title">Transfer Check</h2>
                      <SummaryRow label="Current Savings Now" value={summary.currentSavings} />
                      <SummaryRow label="Less: Unpaid Bills Still to Cover" value={-summary.remainingBills} />
                      <SummaryRow label="Free Savings After Bills" value={summary.freeSavingsAfterBills} emphasis />
                      <SummaryRow label="Plus: Income This Month" value={summary.income} />
                      <SummaryRow label="Projected Increase This Month" value={summary.projectedIncrease} />
                      <SummaryRow label="Projected End Savings" value={summary.projectedEndSavings} emphasis />
                    </section>
                  </>
                )}'''

          old_savings_note = '''            <p className="section-note">This is a month-specific savings snapshot. Editing it does not change another month.</p>'''
          new_savings_note = '''            <p className="section-note">{summary.isComplete ? 'This is the recorded closing savings snapshot for a completed historical month. Editing it does not change another month.' : 'This is a month-specific savings snapshot. Editing it does not change another month.'}</p>'''
          old_total = '''        <div className="total-line"><span>Current Savings</span><span className="money green">{formatMoney(summary.currentSavings)}</span></div>'''
          new_total = '''        <div className="total-line"><span>{summary.isComplete ? 'Closing Savings' : 'Current Savings'}</span><span className="money green">{formatMoney(summary.currentSavings)}</span></div>'''

          for old, new, name in [
              (old_grid, new_grid, 'overview grid'),
              (old_transfer, new_transfer, 'transfer section'),
              (old_savings_note, new_savings_note, 'savings note'),
              (old_total, new_total, 'savings total'),
          ]:
              if old not in text:
                  raise SystemExit(f'Could not find {name} target')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit UI patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'Show historical reconciliation for completed months'
          git push origin HEAD:completed-historical-months
