name: One-off final audit refinements

on:
  push:
    branches:
      - audit-hardening-10of10
    paths:
      - .github/workflows/one-off-final-refinements.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed refinements
        run: python scripts/final_refinements.py
      - name: Commit refined source and remove temporary maintenance files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish Penny audit hardening refinements'
          git push
