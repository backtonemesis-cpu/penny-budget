name: Apply refund-free Penny UI

on:
  push:
    branches: [remove-overview-refunds-card]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-overview-refunds-card
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/apply-refund-free-ui.mjs
      - run: npm ci
      - run: node scripts/self-test.mjs
      - run: node scripts/source-audit.mjs accessibility
      - run: node scripts/source-audit.mjs storage
      - run: node scripts/source-audit.mjs identity
      - run: node scripts/source-audit.mjs currency
      - run: node scripts/source-audit.mjs finance
      - run: npm run build
      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove refund handling from Penny UI"
          git push origin HEAD:remove-overview-refunds-card
