name: Apply category UX fix

on:
  push:
    branches: [fix-category-management-ux]

permissions:
  contents: write

concurrency:
  group: apply-category-ux-fix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-category-management-ux
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply focused source changes
        run: node scripts/apply-category-ux-fix.mjs
      - name: Remove one-time migration files
        run: rm scripts/apply-category-ux-fix.mjs .github/workflows/apply-category-ux-fix.yml
      - name: Commit repaired category experience
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move category management into Add transaction"
          git push origin HEAD:fix-category-management-ux
