name: One-off account ownership patch

on:
  push:
    branches: [account-ownership]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: account-ownership
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply account ownership changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match in {path}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          # finance.js: schema + account ownership migration + transfer-plan enrichment.
          replace_once('src/finance.js', 'export const CURRENT_STATE_VERSION = 8;', 'export const CURRENT_STATE_VERSION = 9;')
          replace_once('src/finance.js', """function normaliseReferenceList(value, prefix) {
            if (!Array.isArray(value)) return [];
            return uniqueById(value.flatMap((item) => {
              const label = cleanText(item?.label, '', 80);
              const id = cleanText(item?.id, '', 120);
              if (!label || !id || id === 'unassigned' || id === 'household') return [];
              return [{ id: id || createId(prefix), label }];
            }));
          }
          """, """function normaliseReferenceList(value, prefix) {
            if (!Array.isArray(value)) return [];
            return uniqueById(value.flatMap((item) => {
              const label = cleanText(item?.label, '', 80);
              const id = cleanText(item?.id, '', 120);
              if (!label || !id || id === 'unassigned' || id === 'household') return [];
              if (prefix === 'account') {
                return [{ id: id || createId(prefix), label, ownerId: cleanText(item?.ownerId, 'unassigned', 120) || 'unassigned' }];
              }
              return [{ id: id || createId(prefix), label }];
            }));
          }
          """)
          replace_once('src/finance.js', "return [{ id, label, balance: nonNegativeNumber(item?.balance) }];\n      }))])", "return [{ id, label, balance: nonNegativeNumber(item?.balance), ownerId: cleanText(item?.ownerId, 'unassigned', 120) || 'unassigned', ownerLabel: cleanText(item?.ownerLabel, '', 80) }];\n      }))])")
          replace_once('src/finance.js', """  const transferPlan = [...plan.values()].sort((a, b) => b.amount - a.amount || a.key.localeCompare(b.key));
            const bankBalances = bankBalanceMap(state, monthKey);
            const accountPlan = new Map();
          """, """  const transferPlan = [...plan.values()].sort((a, b) => b.amount - a.amount || a.key.localeCompare(b.key));
            const bankBalances = bankBalanceMap(state, monthKey);
            const masterAccounts = Object.fromEntries((state?.accounts || []).map((account) => [account.id, account]));
            const accountPlan = new Map();
          """)
          replace_once('src/finance.js', """    const key = row.account || 'unassigned';
              const bankBalance = bankBalances[key];
              const current = accountPlan.get(key) || {
                key,
                account: key,
                accountLabel: row.accountLabel || bankBalance?.label,
                amount: 0,
          """, """    const key = row.account || 'unassigned';
              const bankBalance = bankBalances[key];
              const masterAccount = masterAccounts[key];
              const ownerId = bankBalance?.ownerId && bankBalance.ownerId !== 'unassigned'
                ? bankBalance.ownerId
                : masterAccount?.ownerId || 'unassigned';
              const current = accountPlan.get(key) || {
                key,
                account: key,
                accountLabel: row.accountLabel || bankBalance?.label || masterAccount?.label,
                ownerId,
                ownerLabel: bankBalance?.ownerLabel || '',
                amount: 0,
          """)
          replace_once('src/finance.js', """  const hasUnconfirmedBankBalances = accountFundingPlan.some((row) => !row.hasCurrentBalance);
            const totalTransferNeeded = sumMoney(accountFundingPlan.map((row) => row.transferNeeded));
          """, """  const hasUnconfirmedBankBalances = accountFundingPlan.some((row) => !row.hasCurrentBalance);
            const hasUnconfirmedAccountOwners = accountFundingPlan.some((row) => !row.ownerId || row.ownerId === 'unassigned');
            const totalTransferNeeded = sumMoney(accountFundingPlan.map((row) => row.transferNeeded));
          """)
          replace_once('src/finance.js', """    accountFundingPlan,
              hasUnconfirmedBankBalances,
              totalTransferNeeded,
          """, """    accountFundingPlan,
              hasUnconfirmedBankBalances,
              hasUnconfirmedAccountOwners,
              totalTransferNeeded,
          """)

          # state.js: preserve owner metadata in master accounts and monthly bank snapshots.
          replace_once('src/state.js', """    case 'SET_REFERENCE_LIST': {
              if (!['people', 'accounts'].includes(action.field) || !Array.isArray(action.items)) return state;
              const before = state[action.field];
              const next = { ...state, [action.field]: action.items };
              return appendAudit(next, action, { action: 'update', entityType: action.field, label: action.field === 'people' ? 'Household people' : 'Accounts', before, after: action.items });
            }
          """, """    case 'SET_REFERENCE_LIST': {
              if (!['people', 'accounts'].includes(action.field) || !Array.isArray(action.items)) return state;
              const before = state[action.field];
              const items = action.field === 'accounts'
                ? action.items.map((item) => ({ ...item, ownerId: item?.ownerId || 'unassigned' }))
                : action.items;
              const next = { ...state, [action.field]: items };
              return appendAudit(next, action, { action: 'update', entityType: action.field, label: action.field === 'people' ? 'Household people' : 'Accounts', before, after: items });
            }
          """)
          replace_once('src/state.js', ".map((item) => ({ id: item.id, label: item.label, balance: positiveNumber(item?.balance) }))", ".map((item) => ({ id: item.id, label: item.label, balance: positiveNumber(item?.balance), ownerId: item?.ownerId || 'unassigned', ownerLabel: item?.ownerLabel || '' }))")
          replace_once('src/state.js', """  if (field === 'people') {
              return Object.values(state.txnsByMonth).some((rows) => rows.some((transaction) => transaction.paidBy === referenceId))
                || Object.values(state.incomeByMonth).some((rows) => rows.some((record) => record.receivedBy === referenceId));
            }
          """, """  if (field === 'people') {
              return Object.values(state.txnsByMonth).some((rows) => rows.some((transaction) => transaction.paidBy === referenceId))
                || Object.values(state.incomeByMonth).some((rows) => rows.some((record) => record.receivedBy === referenceId))
                || (state.accounts || []).some((account) => account.ownerId === referenceId);
            }
          """)

          # storage.js: allow a month import to enrich an existing TBC account owner, never overwrite an explicit owner.
          insert_after = """function mergeById(existing = [], incoming = []) {
            const merged = new Map(existing.map((item) => [item.id, item]));
            incoming.forEach((item) => {
              if (item?.id && !merged.has(item.id)) merged.set(item.id, item);
            });
            return [...merged.values()];
          }
          """
          add = insert_after + """
          function mergeAccountsById(existing = [], incoming = []) {
            const merged = new Map(existing.map((item) => [item.id, item]));
            incoming.forEach((item) => {
              if (!item?.id) return;
              const current = merged.get(item.id);
              if (!current) {
                merged.set(item.id, item);
                return;
              }
              const currentOwner = current.ownerId || 'unassigned';
              const incomingOwner = item.ownerId || 'unassigned';
              if (currentOwner === 'unassigned' && incomingOwner !== 'unassigned') {
                merged.set(item.id, { ...current, ownerId: incomingOwner });
              }
            });
            return [...merged.values()];
          }
          """
          replace_once('src/storage.js', insert_after, add)
          replace_once('src/storage.js', 'accounts: mergeById(current.accounts, incoming.accounts),', 'accounts: mergeAccountsById(current.accounts, incoming.accounts),')

          # App.jsx: owner-aware account choices, displays and settings editor.
          replace_once('src/App.jsx', """  const peopleOptions = useMemo(() => [...state.people, ...SPECIAL_PEOPLE], [state.people]);
            const accountOptions = useMemo(() => [...state.accounts, ...SPECIAL_ACCOUNTS], [state.accounts]);
            const peopleMap = useMemo(() => makeReferenceMap(state.people, SPECIAL_PEOPLE), [state.people]);
            const accountMap = useMemo(() => makeReferenceMap(state.accounts, SPECIAL_ACCOUNTS), [state.accounts]);
          """, """  const peopleOptions = useMemo(() => [...state.people, ...SPECIAL_PEOPLE], [state.people]);
            const peopleMap = useMemo(() => makeReferenceMap(state.people, SPECIAL_PEOPLE), [state.people]);
            const accountOwnerOptions = useMemo(() => [...state.people, { id: 'household', label: 'Joint' }, { id: 'unassigned', label: 'TBC' }], [state.people]);
            const accountOptions = useMemo(() => [
              ...state.accounts.map((account) => ({ ...account, displayLabel: ownedAccountLabel(account, peopleMap) })),
              ...SPECIAL_ACCOUNTS,
            ], [state.accounts, peopleMap]);
            const accountMap = useMemo(() => makeReferenceMap(state.accounts, SPECIAL_ACCOUNTS), [state.accounts]);
          """)
          replace_once('src/App.jsx', """            canEdit={canEditMonth}
                        mutate={mutate}
                      />
          """, """            canEdit={canEditMonth}
                        peopleMap={peopleMap}
                        mutate={mutate}
                      />
          """)
          replace_once('src/App.jsx', 'function Savings({ state, summary, monthKey, month, year, canEdit, mutate }) {', 'function Savings({ state, summary, monthKey, month, year, canEdit, peopleMap, mutate }) {')
          replace_once('src/App.jsx', "const nextRow = { id: account.id, label: account.label, balance: Math.max(0, Number(balance) || 0) };", "const nextRow = { id: account.id, label: account.label, balance: Math.max(0, Number(balance) || 0), ownerId: account.ownerId || 'unassigned', ownerLabel: accountOwnerLabel(account, peopleMap) };")
          replace_once('src/App.jsx', """              balance={bankBalanceMap[account.id]?.balance}
                          canEdit={canEdit}
          """, """              balance={bankBalanceMap[account.id]?.balance}
                          peopleMap={peopleMap}
                          canEdit={canEdit}
          """)
          replace_once('src/App.jsx', 'function BankBalanceEditor({ account, balance, canEdit, onCommit }) {', 'function BankBalanceEditor({ account, balance, peopleMap, canEdit, onCommit }) {')
          replace_once('src/App.jsx', '<div className="row-title">{account.label}</div>\n        <div className="muted">Current balance before savings top-up</div>', '<div className="row-title">{ownedAccountLabel(account, peopleMap)}</div>\n        <div className="muted">Current balance before savings top-up</div>')
          replace_once('src/App.jsx', """          <section className="settings-section">
                        <h3>Accounts</h3>
                        <p className="section-note">Renaming an account changes future choices; historical records keep their saved account label.</p>
                        <ReferenceEditor field="accounts" items={state.accounts} state={state} mutate={mutate} placeholder="Account name" />
                      </section>
          """, """          <section className="settings-section">
                        <h3>Accounts</h3>
                        <p className="section-note">Every bill-paying account has an explicit owner: a household person, Joint, or TBC. Existing accounts stay TBC until you confirm them.</p>
                        <AccountReferenceEditor items={state.accounts} ownerOptions={accountOwnerOptions} state={state} mutate={mutate} />
                      </section>
          """)
          replace_once('src/App.jsx', '{options.map((item) => <option key={item.id} value={item.id}>{item.label}</option>)}', '{options.map((item) => <option key={item.id} value={item.id}>{item.displayLabel || item.label}</option>)}')
          # Qualify transaction and bill account displays with the account owner.
          Path('src/App.jsx').write_text(Path('src/App.jsx').read_text().replace(
              "transaction.accountLabel || accountMap[transaction.account]?.label || transaction.account",
              "ownedRecordAccountLabel(transaction, accountMap, peopleMap)"
          ).replace(
              "record.accountLabel || accountMap[record.account]?.label || record.account",
              "ownedRecordAccountLabel(record, accountMap, peopleMap)"
          ))
          replace_once('src/App.jsx', """                <div className="row-title">{row.accountLabel || accountMap[row.account]?.label || row.account}</div>
                        <div className="muted">{row.count} unpaid item{row.count === 1 ? '' : 's'} to cover from this account</div>
          """, """                <div className="row-title">{fundingAccountLabel(row, accountMap, peopleMap)}</div>
                        <div className="muted">Account owner: {fundingOwnerLabel(row, peopleMap)} · {row.count} unpaid item{row.count === 1 ? '' : 's'} to cover</div>
          """)

          # Insert dedicated account editor before the generic reference row editor.
          marker = "function ReferenceRowEditor({ item, inUse, onCommit, onRemove }) {"
          account_editor = """function AccountReferenceEditor({ items, ownerOptions, state, mutate }) {
            const [newLabel, setNewLabel] = useState('');
            const [newOwnerId, setNewOwnerId] = useState('unassigned');
            const add = () => {
              const label = newLabel.trim();
              if (!label) return;
              mutate({
                type: 'SET_REFERENCE_LIST',
                field: 'accounts',
                items: [...items, { id: createId('account'), label: label.slice(0, 80), ownerId: newOwnerId }],
                auditLabel: `Add ${label} account`,
              });
              setNewLabel('');
              setNewOwnerId('unassigned');
            };
            const update = (id, patch) => {
              const before = items.find((item) => item.id === id);
              if (!before) return;
              const after = { ...before, ...patch };
              if (after.label === before.label && (after.ownerId || 'unassigned') === (before.ownerId || 'unassigned')) return;
              mutate({
                type: 'SET_REFERENCE_LIST',
                field: 'accounts',
                items: items.map((item) => item.id === id ? after : item),
                auditLabel: `Update ${before.label} account details`,
              });
            };
            const remove = (id) => {
              if (referenceInUse(state, 'accounts', id)) return;
              const before = items.find((item) => item.id === id);
              mutate({ type: 'SET_REFERENCE_LIST', field: 'accounts', items: items.filter((item) => item.id !== id), auditLabel: `Remove ${before?.label || 'account'}` });
            };
            return (
              <>
                {items.map((item) => (
                  <AccountReferenceRowEditor
                    key={item.id}
                    item={item}
                    ownerOptions={ownerOptions}
                    inUse={referenceInUse(state, 'accounts', item.id)}
                    onCommit={(patch) => update(item.id, patch)}
                    onRemove={() => remove(item.id)}
                  />
                ))}
                <div className="settings-row account-settings-row">
                  <input value={newLabel} onChange={(event) => setNewLabel(event.target.value)} placeholder="Account name" aria-label="Account name" />
                  <select value={newOwnerId} onChange={(event) => setNewOwnerId(event.target.value)} aria-label="Account owner">
                    {ownerOptions.map((owner) => <option key={owner.id} value={owner.id}>{owner.label}</option>)}
                  </select>
                  <button className="primary-button" disabled={!newLabel.trim()} onClick={add}>Add</button>
                </div>
              </>
            );
          }

          function AccountReferenceRowEditor({ item, ownerOptions, inUse, onCommit, onRemove }) {
            const [draft, setDraft] = useState(item.label);
            useEffect(() => setDraft(item.label), [item.label]);
            const commitLabel = () => {
              const trimmed = draft.trim();
              if (!trimmed) {
                setDraft(item.label);
                return;
              }
              if (trimmed !== item.label) onCommit({ label: trimmed.slice(0, 80) });
            };
            return (
              <div className="settings-row account-settings-row">
                <input aria-label="Account name" value={draft} onChange={(event) => setDraft(event.target.value)} onBlur={commitLabel} />
                <select value={item.ownerId || 'unassigned'} onChange={(event) => onCommit({ ownerId: event.target.value })} aria-label={`${item.label} owner`}>
                  {ownerOptions.map((owner) => <option key={owner.id} value={owner.id}>{owner.label}</option>)}
                </select>
                <button className="danger-button" disabled={inUse} title={inUse ? 'Used by existing records' : 'Remove'} onClick={onRemove}>{inUse ? 'In use' : 'Remove'}</button>
              </div>
            );
          }

          """ + marker
          replace_once('src/App.jsx', marker, account_editor)

          # Insert owner display helpers before preservedOrSelectedLabel.
          helper_marker = "function preservedOrSelectedLabel(existingId, existingLabel, nextId, options) {"
          helpers = """function accountOwnerLabel(account, peopleMap) {
            const ownerId = account?.ownerId || 'unassigned';
            if (ownerId === 'household') return 'Joint';
            if (ownerId === 'unassigned') return 'TBC';
            return peopleMap[ownerId]?.label || 'TBC';
          }

          function ownedAccountLabel(account, peopleMap) {
            if (!account) return 'TBC · Unassigned';
            return `${accountOwnerLabel(account, peopleMap)} · ${account.label}`;
          }

          function ownedRecordAccountLabel(record, accountMap, peopleMap) {
            const account = accountMap[record?.account];
            const label = record?.accountLabel || account?.label || record?.account || 'Unassigned';
            if (!record?.account || record.account === 'unassigned') return label;
            return `${accountOwnerLabel(account, peopleMap)} · ${label}`;
          }

          function fundingOwnerLabel(row, peopleMap) {
            if (row?.ownerLabel && row.ownerLabel !== 'TBC') return row.ownerLabel;
            if (row?.ownerId === 'household') return 'Joint';
            if (!row?.ownerId || row.ownerId === 'unassigned') return 'TBC';
            return peopleMap[row.ownerId]?.label || 'TBC';
          }

          function fundingAccountLabel(row, accountMap, peopleMap) {
            const accountLabel = row?.accountLabel || accountMap[row?.account]?.label || row?.account || 'Unassigned';
            return `${fundingOwnerLabel(row, peopleMap)} · ${accountLabel}`;
          }

          """ + helper_marker
          replace_once('src/App.jsx', helper_marker, helpers)

          # styles.css: style account-owner selects cleanly on mobile and desktop.
          replace_once('src/styles.css', '.field input, .field select, .settings-row input {', '.field input, .field select, .settings-row input, .settings-row select {')
          with Path('src/styles.css').open('a') as f:
              f.write("""

          .account-settings-row { flex-wrap: wrap; }
          .account-settings-row input { flex: 1 1 180px; }
          .account-settings-row select { flex: 0 0 150px; }
          @media (max-width: 480px) {
            .account-settings-row input,
            .account-settings-row select { flex: 1 1 100%; }
            .account-settings-row .primary-button,
            .account-settings-row .danger-button { flex: 1 1 100%; }
          }
          """)

          # Tests: explicit ownership, TBC migration, snapshot persistence.
          replace_once('scripts/self-test.mjs', "accounts: [{ id: 'a1', label: 'Account 1' }, { id: 'a2', label: 'Account 2' }],", "accounts: [{ id: 'a1', label: 'Account 1', ownerId: 'p1' }, { id: 'a2', label: 'Account 2', ownerId: 'p2' }],")
          replace_once('scripts/self-test.mjs', "assert.equal(july.accountFundingPlan[0].hasCurrentBalance, false, 'Missing bank balances must not be treated as confirmed zero evidence.');", "assert.equal(july.accountFundingPlan[0].hasCurrentBalance, false, 'Missing bank balances must not be treated as confirmed zero evidence.');\nassert.equal(july.accountFundingPlan[0].ownerId, 'p2', 'Transfer rows must identify the bank-account owner.');\nassert.equal(july.hasUnconfirmedAccountOwners, false);")
          replace_once('scripts/self-test.mjs', "accounts: [{ id: 'a1', label: 'Account 1' }],\n  bankBalancesByMonth: {\n    '2026-10': [{ id: 'a1', label: 'Account 1', balance: 60 }],", "people: [{ id: 'p1', label: 'Person 1' }, { id: 'p2', label: 'Person 2' }],\n  accounts: [{ id: 'a1', label: 'Account 1', ownerId: 'p1' }],\n  bankBalancesByMonth: {\n    '2026-10': [{ id: 'a1', label: 'Account 1', balance: 60, ownerId: 'p1', ownerLabel: 'Person 1' }],")
          replace_once('scripts/self-test.mjs', "assert.equal(monthSummary(fundingPlanState, '2026-10').hasUnconfirmedBankBalances, false);", "assert.equal(monthSummary(fundingPlanState, '2026-10').hasUnconfirmedBankBalances, false);\nassert.equal(fundingPlan[0].ownerId, 'p1');\nassert.equal(fundingPlan[0].ownerLabel, 'Person 1');\nassert.equal(monthSummary(fundingPlanState, '2026-10').hasUnconfirmedAccountOwners, false);")
          replace_once('scripts/self-test.mjs', "items: [{ id: 'a1', label: 'Account 1', balance: 72.345 }],", "items: [{ id: 'a1', label: 'Account 1', balance: 72.345, ownerId: 'p1', ownerLabel: 'Person 1' }],")
          replace_once('scripts/self-test.mjs', "assert.equal(changedBankBalance.bankBalancesByMonth['2026-10'][0].balance, 72.35, 'Bill-paying bank balances must be normalised to pennies.');", "assert.equal(changedBankBalance.bankBalancesByMonth['2026-10'][0].balance, 72.35, 'Bill-paying bank balances must be normalised to pennies.');\nassert.equal(changedBankBalance.bankBalancesByMonth['2026-10'][0].ownerId, 'p1', 'Bank-balance snapshots must preserve account ownership.');")
          marker = "const legacyUncertain = normaliseTransaction({"
          owner_tests = """const ownerMigration = migrateState({
            version: 8,
            people: [{ id: 'p1', label: 'Person 1' }],
            accounts: [
              { id: 'owned', label: 'Owned Account', ownerId: 'p1' },
              { id: 'legacy-account', label: 'Legacy Account' },
            ],
          }, new Date(2026, 8, 1));
          assert.equal(ownerMigration.version, CURRENT_STATE_VERSION);
          assert.equal(ownerMigration.accounts.find((account) => account.id === 'owned').ownerId, 'p1', 'Explicit account ownership must survive migration.');
          assert.equal(ownerMigration.accounts.find((account) => account.id === 'legacy-account').ownerId, 'unassigned', 'Legacy accounts must migrate to Owner TBC rather than being guessed.');

          """ + marker
          replace_once('scripts/self-test.mjs', marker, owner_tests)

          # Source audit: make ownership part of the permanent regression gate.
          replace_once('scripts/source-audit.mjs', "assert.match(files.finance, /hasUnconfirmedBankBalances/, 'Missing bank balances must keep transfer totals marked as unconfirmed.');", "assert.match(files.finance, /hasUnconfirmedBankBalances/, 'Missing bank balances must keep transfer totals marked as unconfirmed.');\n  assert.match(files.finance, /ownerId/, 'Bank accounts and transfer rows must carry explicit ownership metadata.');\n  assert.match(files.finance, /hasUnconfirmedAccountOwners/, 'Transfer planning must expose account-owner TBC state.');\n  assert.match(files.storage, /mergeAccountsById/, 'Imports must preserve explicit account ownership without overwriting an existing confirmed owner.');")
          replace_once('scripts/source-audit.mjs', "assert.match(files.app, /Bill-Paying Bank Balances/);", "assert.match(files.app, /Bill-Paying Bank Balances/);\n  assert.match(files.app, /Every bill-paying account has an explicit owner/);\n  assert.match(files.app, /AccountReferenceEditor/);\n  assert.match(files.app, /ownedAccountLabel/);\n  assert.match(files.app, /Account owner:/);")

          # Release metadata and change log.
          Path('public/version.json').write_text('{\n  "version": "2026-08-29-account-ownership-v1"\n}\n')
          manifest = Path('public/manifest.webmanifest').read_text().replace('2026-08-28-audit-hardening-v1', '2026-08-29-account-ownership-v1')
          Path('public/manifest.webmanifest').write_text(manifest)
          changelog = Path('CHANGELOG.md').read_text()
          heading = "# Penny Change Log\n\n"
          entry = """## 29 August 2026 — Explicit bank-account ownership

          - Added an Owner field to every bill-paying account using household person, Joint or TBC references.
          - Existing accounts migrate safely to Owner TBC; Penny does not infer ownership from transaction usage.
          - Account ownership is now visible in Settings, account dropdowns, Transactions, Bills, Savings bank-balance inputs and the Start-of-Month Transfer Plan.
          - Monthly bank-balance snapshots preserve the account owner used for transfer planning.
          - Month imports can fill a previously TBC owner from explicit imported evidence, but cannot overwrite an already-confirmed owner.
          - Change History records account-owner edits together with other account changes.
          - No household names or private account ownership values are embedded in the public repository.

          """
          if heading not in changelog:
              raise SystemExit('CHANGELOG heading missing')
          Path('CHANGELOG.md').write_text(changelog.replace(heading, heading + entry, 1))
          PY
      - name: Run targeted validation
        run: |
          npm ci
          npm run test:finance
          npm run audit:source:finance
          npm run build
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-off-account-ownership.yml
          git add src scripts public CHANGELOG.md
          git commit -m "Add explicit bank account ownership"
          git push origin HEAD:account-ownership
