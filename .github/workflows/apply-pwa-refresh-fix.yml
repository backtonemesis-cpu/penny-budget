name: Apply PWA refresh fix

on:
  push:
    branches:
      - pwa-foreground-update-verification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply refresh patch
        run: python scripts/apply-pwa-refresh-fix.py
      - name: Validate exact patched tree
        run: |
          npm ci
          npm run check
      - name: Commit validated source
        run: |
          rm scripts/apply-pwa-refresh-fix.py
          rm .github/workflows/apply-pwa-refresh-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh installed Penny when iPhone resumes"
          git push
