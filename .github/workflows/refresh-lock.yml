name: Refresh npm lockfile

on:
  push:
    branches:
      - month-specific-savings-june-merge
    paths:
      - '.github/workflows/refresh-lock.yml'
      - 'package.json'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: month-specific-savings-june-merge
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile safely
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify patched dependency
        run: |
          npm ci --ignore-scripts
          npm run audit:all
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Regenerate lockfile with patched nanoid'
          git push origin HEAD:month-specific-savings-june-merge
