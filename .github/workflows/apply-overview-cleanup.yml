name: Apply Overview cleanup

on:
  push:
    branches: [simplify-overview-notices]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: simplify-overview-notices
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Overview cleanup
        run: python scripts/apply-overview-cleanup.py
      - name: Validate exact cleaned tree
        run: |
          npm ci
          npm run check
      - name: Commit cleaned source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-overview-cleanup.py .github/workflows/apply-overview-cleanup.yml
          git add -A
          git commit -m "Simplify Overview notices and month setup"
          git push origin HEAD:simplify-overview-notices
