name: Import verified MV local bundle

on:
  push:
    branches:
      - deploy-mv-local-bundle

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download exact verified MV artifact
        env:
          MV_ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-f240-81f5-ae0d-b8b39f8a189b/raw?se=2026-09-04T03%3A26%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=b055ad4b-5626-531c-8540-5d21527d44fc&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T03%3A12%3A10Z&ske=2026-09-05T03%3A12%3A10Z&sks=b&skv=2026-02-06&sig=yl0Z7xr5tF4B0bhL51ZxX/I4vzTHbX8TCYVHSIRkLgI%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$MV_ARTIFACT_URL" --output /tmp/mv-static-build.zip

      - name: Install bundle under Penny public/MV
        run: |
          set -euo pipefail
          rm -rf public/MV
          mkdir -p public/MV
          unzip -q /tmp/mv-static-build.zip -d public/MV

          test -f public/MV/index.html
          test -d public/MV/assets
          test "$(find public/MV -type f | wc -l | tr -d ' ')" = "3"
          grep --fixed-strings '/penny-budget/MV/assets/' public/MV/index.html

          if grep -R --line-number --fixed-strings 'backtonemesis@gmail.com' public/MV; then
            echo "Refusing to publish private owner email"
            exit 1
          fi

          if grep -R --line-number -E 'regal-campus-198sv|firebaseapp\.com|@firebase/' public/MV; then
            echo "Refusing to publish retired Firebase configuration"
            exit 1
          fi

      - name: Commit static MV bundle and remove importer
        run: |
          set -euo pipefail
          rm .github/workflows/import-mv-local.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/MV .github/workflows/import-mv-local.yml
          git commit -m "Publish verified local-only MV bundle"
          git push origin HEAD:deploy-mv-local-bundle
