name: Apply mobile editor repair

on:
  push:
    branches: [fix-mobile-transaction-editor]
    paths:
      - 'scripts/apply-mobile-editor-fix.py'
      - '.github/workflows/apply-mobile-editor-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply modal repair
        run: python scripts/apply-mobile-editor-fix.py
      - name: Validate exact patched tree
        run: |
          npm ci
          npm run check
      - name: Commit validated source
        run: |
          rm scripts/apply-mobile-editor-fix.py
          rm .github/workflows/apply-mobile-editor-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair mobile transaction editor"
          git push
