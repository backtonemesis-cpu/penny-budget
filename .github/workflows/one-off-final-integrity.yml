name: One-off final integrity patch

on:
  push:
    branches: [audit-hardening-10of10]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply final integrity patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit-hardening-10of10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final integrity patch
        run: python scripts/final_integrity_patch.py
      - name: Remove one-off helpers and commit
        run: |
          git rm .github/workflows/one-off-final-integrity.yml scripts/final_integrity_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/finance.js scripts/final-audit-test.mjs scripts/source-audit.mjs AUDIT.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Apply final integrity patch"
          git push origin HEAD:audit-hardening-10of10
