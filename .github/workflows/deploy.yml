name: Test and deploy Penny

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Audit all dependencies and build tools
        run: npm run audit:all
      - name: Run finance and storage tests
        run: node scripts/self-test.mjs
      - name: Run final evidence and recovery tests
        run: node scripts/final-audit-test.mjs
      - name: Run Settings menu audit
        run: node scripts/settings-menu-audit.mjs
      - name: Run Settings viewport regression
        run: node scripts/settings-viewport-test.mjs
      - name: Run inactive account removal regression
        run: node scripts/account-removal-policy-test.mjs
      - name: Run clear-month safety regression
        run: node scripts/month-clear-test.mjs
      - name: Run standalone month architecture regression
        run: node scripts/month-scope-v28-test.mjs
      - name: Run transfer-plan layout regression
        run: node scripts/transfer-plan-layout-test.mjs
      - name: Run dedicated Transfer Plan tab regression
        run: node scripts/transfer-plan-tab-test.mjs
      - name: Run compact mobile navigation regression
        run: node scripts/mobile-nav-compact-test.mjs
      - name: Run lower bottom navigation regression
        run: node scripts/mobile-nav-lower-v66-test.mjs
      - name: Run lower navigation content regression
        run: node scripts/mobile-nav-content-v67-test.mjs
      - name: Run native-height bottom navigation regression
        run: node scripts/mobile-nav-native-v68-test.mjs
      - name: Run pixel-match bottom navigation regression
        run: node scripts/mobile-nav-pixel-v69-test.mjs
      - name: Run matched navigation content regression
        run: node scripts/mobile-nav-content-v70-test.mjs
      - name: Run desktop month picker regression
        run: node scripts/desktop-month-picker-v75-test.mjs
      - name: Audit accessibility source
        run: node scripts/source-audit.mjs accessibility
      - name: Audit storage source
        run: node scripts/source-audit.mjs storage
      - name: Audit private identity data
        run: node scripts/source-audit.mjs identity
      - name: Audit embedded currency data
        run: node scripts/source-audit.mjs currency
      - name: Audit finance source
        run: node scripts/source-audit.mjs finance
      - name: Run mobile layout regression tests
        run: node scripts/modal-layout-test.mjs
      - name: Build production app
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
