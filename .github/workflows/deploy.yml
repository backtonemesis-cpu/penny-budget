name: Test and deploy Penny

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Audit all dependencies and build tools
        run: npm run audit:all
      - name: Run finance and storage tests
        run: node scripts/self-test.mjs
      - name: Audit accessibility source
        run: node scripts/source-audit.mjs accessibility
      - name: Audit storage source
        run: node scripts/source-audit.mjs storage
      - name: Audit private identity data
        run: node scripts/source-audit.mjs identity
      - name: Audit embedded currency data
        run: node scripts/source-audit.mjs currency
      - name: Audit finance source
        run: node scripts/source-audit.mjs finance
      - name: Build production app
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
