name: Squash audited Penny branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: squash-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  squash:
    if: github.event.pull_request.head.ref == 'full-app-audit-10-of-10'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Replace branch history with one audited commit
        run: |
          set -euxo pipefail
          git fetch origin main
          commit_count=$(git rev-list --count origin/main..HEAD)
          if [ "$commit_count" -le 1 ]; then
            echo "Branch history is already clean."
            exit 0
          fi
          git reset --soft origin/main
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Full Penny audit and reliability rebuild"
          git push --force origin HEAD:${{ github.event.pull_request.head.ref }}
